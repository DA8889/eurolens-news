# Candidate feeds for pair news (eurolens/PAIR_NEWS_SOURCES.md sections 3.3-3.4), checked live
# by verify_sources.py (locally and from GitHub Actions: verify-sources.yml) before any goes into
# sources.yaml with add_source.py. Fields as in sources.yaml, except `urls`: tried in order, each
# a feed or a page advertising one. Nothing here is fetched by collect.py.
#
# Left out after checks on 2026-11-19 (from home):
#   - GOV.UK world-location feeds (news-and-communications.atom?world_locations[]=france): they
#     work, but are low volume (Czechia: 20 items in 3 years) and full of multilateral joint
#     statements filed under many countries (the same E4 statement under Czechia and Malta), so
#     their country is no evidence of a pair. Their items are already in gb_gov (all GOV.UK news).
#   - France Diplomatie per-country feeds: the site was restructured (/fr/information-par-pays/)
#     and advertises no feed; the brief's /en/backend-fd.php3 is 404. Only the newsroom pages
#     stay below, to record the result.
#   - The Local bilateral tag feeds (feeds.thelocal.com/rss/fr/france-and-the-uk and others):
#     valid RSS with no items, and no "X and Y" tags on any edition's /topics page.
#   - Google News site: routes for ministries without feeds: deferred while Google News answers
#     the Actions runner with HTTP 429 (owner decision, 2026-11-19).

