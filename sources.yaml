# EuroLens — news source seed config
# Companion to EuroLens_News_Sources_Directory.md (full list, incl. uncertain/newsroom-only sources).
# This file holds only feeds with a known URL and confidence = verified | documented.
# Validate each endpoint at first ingestion; feeds drift.
#
# Field key:
#   tier:       eu | broadcaster | agency | government | parliament | central_bank | stat_office | wire | aggregator
#   country:    ISO-2 (EL=Greece, GB=UK) or EU for institutions / — for pan-European
#   confidence: verified (fetched to live XML) | documented (listed officially, not fetch-checked here)
#   license:    eu_reuse (Dec 2011/833 / CC BY 4.0) | psi_attribution (public-sector info, attribute)
#               | broadcaster_snippet (headline+link+short snippet only) | agency_free_attribution
#               | agency_commercial (do NOT pull full text; reach via aggregator) | open_cc | aggregator
#   note:       caveats
#
# Ingestion rule (all tiers): store link + source + short snippet + your own summary; never re-host full text.

defaults:
  poll_minutes: 30           # institutions can be hourly+; agencies/broadcasters 15-30 min
  user_agent: "EuroLensNewsBot/0.1 (+contact-you@example.com)"
  respect_robots: true

feeds:

