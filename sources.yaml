  - {id: eu_council_pressreleases,  tier: eu, country: EU, name: "Council of the EU — Press releases",  url: "https://www.consilium.europa.eu/en/rss/pressreleases.ashx",       lang: en, confidence: documented, license: eu_reuse, note: "language set by /en/ path segment"}
