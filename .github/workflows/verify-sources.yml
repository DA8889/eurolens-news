name: verify-sources

# Manual check: tests the candidate feeds in sources_candidates.yaml and GDELT's raw Events files
# from GitHub's servers, which some sites treat differently from a home connection.
# Writes nothing to the repo; the report appears on the run's summary page and as an artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt openpyxl
      - run: python verify_sources.py --gdelt
      - uses: actions/upload-artifact@v4
        with:
          name: verify-sources
          path: exports/verify_sources_*
