name: collect

on:
  schedule:
    - cron: "*/30 * * * *"   # matches poll_minutes: 30 in sources.yaml; GitHub may delay runs
  workflow_dispatch:
  push:
    branches: [main]
    paths: [sources.yaml, collect.py, site/index.html]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python collect.py

      - name: Commit new archive items
        run: |
          git config user.name "eurolens-news-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive
          if git diff --cached --quiet; then
            echo "No new items"
          else
            git commit -q -m "archive: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -q origin main
            git push -q origin HEAD:main
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
