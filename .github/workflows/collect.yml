name: collect

on:
  schedule:
    - cron: "7,37 * * * *"   # backup only: GitHub starts ~5 of these a day; cron-job.org calls workflow_dispatch every 30 min
  workflow_dispatch:
  push:
    branches: [main]
    paths: [sources.yaml, collect.py, site/index.html]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}   # healthchecks.io emails if pings stop
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python collect.py

      # Off until the owner sets the repository variable SCORING to "on"
      # (Settings > Secrets and variables > Actions > Variables).
      - name: Score new headlines
        if: vars.SCORING == 'on'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python score.py

      - name: Commit new archive items
        run: |
          git config user.name "eurolens-news-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive runs
          if [ -d scores ]; then git add scores; fi
          if git diff --cached --quiet; then
            echo "No new items"
          else
            git commit -q -m "archive: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -q origin main
            git push -q origin HEAD:main
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Ping healthchecks.io
        if: always() && env.HEALTHCHECK_URL != ''
        run: curl -fsS -m 10 --retry 3 -o /dev/null "$HEALTHCHECK_URL${{ job.status != 'success' && '/fail' || '' }}"
