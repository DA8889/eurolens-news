# Sites whose first label marks a discussion forum, not news (keskustelu = discussion in Finnish).
block_domain_prefixes:
  forum: ["forum.", "forums.", "keskustelu."]

# Kept on purpose, your decision 2 Nov (stock tickers and company filings that occasionally
# carry economic news). Listed so nobody adds them to block_domains by accident.
not_blocked:
  - finanznachrichten.de
  - wallstreet-online.de
  - investegate.co.uk
  - aktiencheck.de
# Kept on purpose, your decision 3 Nov: an Italian aggregator that mostly re-posts other
# outlets' news. Its crossword and horoscope pages are caught by the section_games and
# horoscope rules; copies of other outlets' headlines are removed as duplicates.
  - zazoom.it

# Regular expressions on the URL path (lower-cased). Sport sections are deliberately NOT
# here: your "Premier League shirts" keep was on bbc.co.uk/sport/football/.
url_sections:
  celebrity: '/(promi|promis|stars|people|vip|gossip|celebrity|celebrities|showbiz|boulevard|klatsch|famosos|famosi|spettacoli|unterhaltung|entertainment|tv-news)/'
  horoscope: '/(horoskop|horoskope|horoscope|horoscopes|horoscopo|oroscopo|horoskooppi|horoszkop|horoscop|astrologie|astrology)/'
  recipes: '/(rezepte|rezept|recipes|recipe|recettes|recette|ricette|ricetta|recetas|receta|recepten|recept|recepty|przepisy)/'
  games: '/(games|spiele|jeux|giochi|puzzles|quiz|crossword|crosswords|sudoku|soluzioni-cruciverba|kreuzwortraetsel)/'
  listings: '/(sendungsdetails|tv-programm|programme-tv|pour-sortir|eventi|veranstaltungen)/'
  profile_or_tag_page: '^/(author|autor|autore|autori|auteur|persona|members|tag|tags)/[^/]+/?$'
  date_archive_page: '^/\d{4}/\d{2}(/\d{2})?/?$'

# Regular expressions on the title (lower-cased).
titles:
  bot_wall: '^(client challenge|just a moment|access denied|attention required|are you a robot|403 forbidden|404 not found|page not found|seite nicht gefunden|pagina non trovata|página no encontrada)\b'
  horoscope: '\b(horoskop|horoscope|horóscopo|horoscopo|oroscopo|horoskooppi|horoszkóp|horoscop|ωροσκόπιο|sternzeichen|segno zodiacale)\b'
  puzzles_and_lottery: '\b(lottozahlen|eurojackpot|euromillions|superenalotto|wordle|sudoku|crossword|cruciverba|kreuzworträtsel)\b'
