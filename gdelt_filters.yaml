# Free filters for a GDELT export (gdelt_filter.py, run by gdelt_score.py). They run before
# any AI step and only remove pages that are never EuroLens material. Rules apply in this order;
# the first match is the reason shown on the Removed sheet. Duplicate headlines are
# removed last. Every removed article is listed with its reason, so nothing goes unseen.

max_age_hours: 72    # drop articles published more than this long before the window start

# Whole sites. A domain also matches its subdomains (bild.de matches sportbild.bild.de).
block_domains:
  non_news:          # not news articles at all: games, job ads, TV listings, landing pages
    - pelit.fi
    - karriere.at
    - tele.at
    - tvheute.at
    - klack.de
    - hoerzu.de
    - netzwelt.de
    - newsnow.co.uk
  aggregator:        # re-posts other outlets' stories (your decision, 2 Nov)
    - drimble.nl
  sports:            # sport-only sites
    - kicker.de
    - sport1.de
    - spox.com
    - ran.de
    - transfermarkt.de
    - transfermarkt.co.uk
    - transfermarkt.it
    - transfermarkt.es
    - gazzetta.it
    - corrieredellosport.it
    - tuttosport.com
